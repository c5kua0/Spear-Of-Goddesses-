name: Build Spear of Goddesses

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build Plugin
        run: gradle clean build

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: SpearOfGoddesses
          path: build/libs/SpearOfGoddesses-*.jar
